[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-intelligence-platform"
version = "0.1.0"
description = "AI Knowledge Intelligence Platform with automated Knowledge Gap Detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sankalp", email = "sankalp@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.17",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pyjwt[crypto]>=2.10.0",
    "bcrypt>=4.2.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "pypdf>=5.1.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.6.0",
    "google-genai>=1.0.0",
    "openai>=1.57.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
